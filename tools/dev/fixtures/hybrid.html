<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>App de mensagens hibrido (fixture: caso Prado)</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #ffffff; display: flex; height: 100vh; }
  aside { width: 300px; background: #17212b; color: #dddddd; padding: 16px; flex-shrink: 0; }
  aside h2 { color: #ffffff; font-size: 16px; }
  aside ul { list-style: none; padding: 0; }
  aside li { padding: 10px; border-radius: 6px; margin: 4px 0; }
  aside li.active { background: #2b5278; color: #ffffff; }
  section { flex: 1; background: #ffffff; color: #111111; display: flex; flex-direction: column; }
  .chat-head { background: #f0f0f0; color: #222222; padding: 12px 16px; border-bottom: 1px solid #dddddd; }
  .chat { flex: 1; padding: 16px; overflow-y: auto; }
  .msg { background: #f2f2f2; color: #000000; border-radius: 10px; padding: 10px 14px; margin: 6px 0; max-width: 60%; }
  .msg.me { background: #dbeafi; color: #0a2b4a; margin-left: auto; }
  .composer { background: #f5f5f5; border-top: 1px solid #dddddd; padding: 12px; display: flex; gap: 8px; }
  .composer input { flex: 1; background: #ffffff; color: #111111; border: 1px solid #bbbbbb; padding: 10px; border-radius: 20px; }
  .composer button { background: #3390ec; color: #ffffff; border: none; border-radius: 20px; padding: 10px 18px; }
</style>
</head>
<body>
  <aside>
    <h2>Conversas</h2>
    <ul>
      <li class="active">Joao</li>
      <li>Maria</li>
      <li>Grupo do trabalho</li>
      <li>Canal de novidades</li>
    </ul>
  </aside>
  <section>
    <div class="chat-head"><strong>Joao</strong> — online</div>
    <div class="chat">
      <div class="msg">Oi! Viu que a extensao agora analisa por elemento?</div>
      <div class="msg me">Sim, a sidebar escura continua escura e o chat claro escurece.</div>
      <div class="msg">E exatamente o caso que quebrava na inversao global.</div>
    </div>
    <div class="composer">
      <input type="text" placeholder="Mensagem">
      <button>Enviar</button>
    </div>
  </section>
</body>
</html>
